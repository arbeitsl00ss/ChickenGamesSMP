  shop-disabled: "&cDer Shop ist momentan deaktiviert."
  shop-category-disabled: "&cDiese Shop-Kategorie ist deaktiviert."
  shop-category-no-permission: "&cDu darfst diese Kategorie nicht öffnen."
  shop-no-permission: "&cDu darfst dieses Item nicht kaufen."
  shop-not-enough-money: "&cDu hast nicht genug Geld! Preis: {price}"
  shop-purchased: "&aDu hast {amount}x {item} für {price} gekauft."
  shop-overflow-dropped: "&eDein Inventar war voll. Übrige Items wurden neben dir abgelegt."
  shop-inventory-full: "&cDein Inventar ist voll. Kauf abgebrochen."


# ChickenAC - konservatives AntiCheat (meldet Auffälligkeiten, bannt nicht automatisch)
anticheat:
  alerts:
    in-game: true
    console: true
    cooldown-seconds: 4
  checks:
    fly:
      enabled: true
      # Aufeinanderfolgende Messungen mit Aufwärtsbewegung (Abfrage alle 2 Ticks).
      max-rising-samples: 9
      # Längere Bewegung ohne Höhenänderung in der Luft.
      max-hover-samples: 24
    speed:
      enabled: true
      # Erlaubte horizontale Distanz pro Bewegungs-Event.
      max-horizontal-distance-per-move: 0.65
    reach:
      enabled: true
      max-distance: 3.55
    autoclicker:
      enabled: true
      max-swings-per-second: 24
    fastplace:
      enabled: true
      max-blocks-per-second: 26
