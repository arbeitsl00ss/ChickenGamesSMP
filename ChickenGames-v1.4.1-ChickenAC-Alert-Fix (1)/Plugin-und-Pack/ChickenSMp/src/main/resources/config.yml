# ChickenGames - zentrale Einstellungen
# Nach Änderungen: /chicken reload (ChickenPerms-Admin oder OP)

# Discord-Konsolenverbindung
# Das Secret niemals öffentlich teilen.
discord-console:
  enabled: false
  url: "https://DEIN-BOT.onrender.com/api/minecraft/console"
  secret: "HIER-LANGES-ZUFAELLIGES-PASSWORT"
  min-level: "INFO"
  send-interval-seconds: 3
  redact-ips: true

# Resource Pack
resource-pack:
  enabled: true
  url: "https://raw.githubusercontent.com/arbeitsl00ss/ChickenGamesSMP/main/ChickenGames-Pack.zip"
  sha1: "9cc1d0a6d7fc0a40b8eb4ecb9f0d2f35a1190a3b"
  required: true

# Scoreboard
scoreboard:
  pack-icons: true
  frame: true

# Wirtschaft
economy:
  starting-balance: 1000.0
  currency-symbol: "$"

# Homes
homes:
  # ChickenGames begrenzt jeden Spieler fest auf maximal drei Homes.
  max-per-player: 3

# Teleports
teleport:
  countdown-seconds: 3
  tpa-request-seconds: 15
  rtp:
    min-radius: 100
    max-radius: 1000
    # Leer = Welt des Spielers; sonst exakter Weltname
    world: ""

# PvP-Kampfzeit
combat:
  tag-seconds: 30

