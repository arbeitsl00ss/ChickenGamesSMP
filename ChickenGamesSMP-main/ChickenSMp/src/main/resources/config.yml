# Konsole live in Discord anzeigen (Bot laeuft z.B. auf Render)
discord-console:
  enabled: false
  # Adresse deines Bots + /api/minecraft/console
  url: "https://DEIN-BOT.onrender.com/api/minecraft/console"
  # Langes zufaelliges Passwort. MUSS identisch mit MC_CONSOLE_SECRET in Render sein.
  # Diese Datei NIE oeffentlich hochladen (GitHub)!
  secret: "HIER-LANGES-ZUFAELLIGES-PASSWORT"
  # Ab welchem Level gesendet wird: DEBUG, INFO, WARN, ERROR
  min-level: "INFO"
  send-interval-seconds: 3
  # IP-Adressen in der Konsole durch x.x.x.x ersetzen
  redact-ips: true
